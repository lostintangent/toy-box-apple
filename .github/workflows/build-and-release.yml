name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build without publishing (vX.Y.Z)
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'release-publication' || format('build-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Select and check the runner toolchain
        run: |
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun swift --version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 27
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test ChannelClient with a single cooperative worker
        env:
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-tests
          NSUnbufferedIO: 'YES'
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: bun run test --filter ChannelClientTests
      - name: Test
        env:
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-tests
          NSUnbufferedIO: 'YES'
        run: bun run test --skip ChannelClientTests
      - name: Upload blocked test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-test-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/toy-box-tests/mac-test-watchdog/*.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Wait for crash reports
        if: failure()
        run: |
          sleep 20
          ls -l ~/Library/Logs/DiagnosticReports || true
      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/Library/Logs/DiagnosticReports/*.ips
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: iOS foundation
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - name: Select and check the iOS toolchain
        run: |
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun swift --version
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK $sdk"
          test "${sdk%%.*}" -ge 27
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the app, widget and notification extensions for iOS Simulator
        env:
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-mobile
        run: |
          bun run simulator --build-only
          app="$SCRATCH_PATH/mobile-simulator/Toy Box.app"
          for executable in ToyBoxMobileWidget ToyBoxMobileNotification; do
            test -x "$app/PlugIns/$executable.appex/$executable"
            codesign --verify --strict "$app/PlugIns/$executable.appex"
          done
      - name: Test iOS modules when an iOS 27 runtime is installed
        env:
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-mobile
        run: bun run test:mobile --if-available

  release-checks:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck tooling
        run: bun check
      - name: Lint workflows
        run: bun run lint:workflows
      - name: Test tooling with fake commands
        run: bun test scripts/shared scripts/desktop scripts/mobile

  release:
    needs: [test, release-checks]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
      NOTARY_PROFILE: toy-box-release-ci
      SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: joncart@outlook.com
      NOTARY_TEAM_ID: RHFNBL7EG4
      SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
    steps:
      - name: Select and check the runner toolchain
        run: |
          DEVELOPER_DIR="$(xcode-select -p)"
          export DEVELOPER_DIR
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcrun swift --version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk"
          test "${sdk%%.*}" -ge 27
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Require the Mac changelog entry
        run: bun run release-notes "$RELEASE_TAG" dist/release-notes.md
      - name: Bundle with Siri and Shortcuts metadata
        env:
          CONFIGURATION: release
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-release
        run: |
          app="$(bun run build --no-open | tail -n 1)"
          actions="$app/Contents/Resources/Metadata.appintents/extract.actionsdata"
          for intent in CatchMeUpIntent OpenChannelIntent SendMessageIntent CatchUpSnippetIntent ReplyIntent \
            OpenToyBoxControlIntent OpenRequestIntent ReplyToRequestIntent; do
            grep -q "\"$intent\"" "$actions"
          done
          grep -q '"WaitingRequestEntity"' "$actions"
          grep -q '"com.apple.appintents.entity.Indexed"' "$actions"
          tools="$(bun scripts/desktop/release/sparkle-tools.ts)"
          TOY_BOX_BUNDLE="$app" SPARKLE_TOOLS_DIR="$tools" bun test scripts/desktop/bundle/native.test.ts
      - name: Check update signing configuration and build number
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          : "${SPARKLE_ED_PRIVATE_KEY:?Missing SPARKLE_ED_PRIVATE_KEY}"
          : "${SPARKLE_ED_PUBLIC_KEY:?Missing SPARKLE_ED_PUBLIC_KEY repository variable}"
          url="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "appcast.xml") | .url')"
          args=("$BUILD_NUMBER")
          if [[ -n "$url" ]]; then
            previous="$RUNNER_TEMP/previous-appcast.xml"
            curl --fail --silent --show-error --location "$url" -o "$previous"
            printf 'PREVIOUS_APPCAST=%s\n' "$previous" >> "$GITHUB_ENV"
            args+=("$previous")
          else
            latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            if [[ "$latest" != v0.1.0 ]]; then
              echo "The latest release is missing its update feed. Refusing to bypass build ordering." >&2
              exit 1
            fi
            echo "Bootstrapping updates from v0.1.0, which shipped without Sparkle."
          fi
          bun scripts/desktop/release/appcast.ts --check-build "${args[@]}"
      - name: Import the signing identity and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          SIGNING_CERTIFICATE_CHAIN: ${{ vars.MACOS_SIGNING_CERTIFICATE_CHAIN }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          umask 077
          : "${CERTIFICATE:?Missing MACOS_SIGNING_CERTIFICATE}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_SIGNING_PASSWORD}"
          : "${SIGNING_IDENTITY:?Missing MACOS_SIGNING_IDENTITY repository variable}"
          : "${SIGNING_CERTIFICATE_CHAIN:?Missing MACOS_SIGNING_CERTIFICATE_CHAIN repository variable}"
          : "${NOTARY_APPLE_ID:?Missing NOTARY_APPLE_ID}"
          : "${NOTARY_TEAM_ID:?Missing NOTARY_TEAM_ID}"
          : "${NOTARY_APP_PASSWORD:?Missing NOTARY_APP_PASSWORD}"
          export SIGNING_KEYCHAIN="$RUNNER_TEMP/toy-box-release.keychain-db"
          export NOTARY_KEYCHAIN="$SIGNING_KEYCHAIN"
          printf 'SIGNING_KEYCHAIN=%s\nNOTARY_KEYCHAIN=%s\n' "$SIGNING_KEYCHAIN" "$NOTARY_KEYCHAIN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/toy-box-signing"
          security list-keychains -d user > "$RUNNER_TEMP/toy-box-signing/search-list.txt"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/toy-box-signing/identity.p12"
          password="$(openssl rand -base64 48)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$password" "$SIGNING_KEYCHAIN"
          keychains=("$SIGNING_KEYCHAIN")
          while IFS= read -r line; do
            keychain="$(sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' <<< "$line")"
            if [[ -n "$keychain" ]]; then keychains+=("$keychain"); fi
          done < "$RUNNER_TEMP/toy-box-signing/search-list.txt"
          security list-keychains -d user -s "${keychains[@]}"
          printf '%s' "$SIGNING_CERTIFICATE_CHAIN" > "$RUNNER_TEMP/toy-box-signing/issuer-chain.pem"
          security import "$RUNNER_TEMP/toy-box-signing/issuer-chain.pem" -k "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/toy-box-signing/identity.p12" \
            -k "$SIGNING_KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$SIGNING_KEYCHAIN" >/dev/null
          xcrun notarytool store-credentials "$NOTARY_PROFILE" --keychain "$NOTARY_KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_APP_PASSWORD"
      - name: Build, sign and notarize
        env:
          SCRATCH_PATH: ${{ runner.temp }}/toy-box-release
        run: bun run release "$RELEASE_TAG"
      - name: Generate the update feed and verify its archive signature
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: bun scripts/desktop/release/appcast.ts "$RELEASE_TAG"
      - name: Remove the temporary keychain and signing material
        if: always()
        run: |
          status=0
          if [[ -f "$RUNNER_TEMP/toy-box-signing/search-list.txt" ]]; then
            keychains=()
            while IFS= read -r line; do
              keychain="$(sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' <<< "$line")"
              if [[ -n "$keychain" ]]; then keychains+=("$keychain"); fi
            done < "$RUNNER_TEMP/toy-box-signing/search-list.txt"
            security list-keychains -d user -s "${keychains[@]}" || status=$?
          fi
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -e "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || status=$?
          fi
          rm -f "$RUNNER_TEMP/toy-box-signing/identity.p12" \
            "$RUNNER_TEMP/toy-box-signing/issuer-chain.pem" "$RUNNER_TEMP/toy-box-signing/search-list.txt" || status=$?
          if [[ -d "$RUNNER_TEMP/toy-box-signing" ]]; then rmdir "$RUNNER_TEMP/toy-box-signing" || status=$?; fi
          exit "$status"
      - name: Upload the signed archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/appcast.xml
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 dist/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file dist/release-notes.md --title "$RELEASE_TAG"
